<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Media Slider - Google Drive</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, -apple-system, sans-serif; }

    .fullscreen {
      width: 100vw; height: 100vh; position: relative;
      display: flex; align-items: center; justify-content: center; background: #000;
    }

    #media-display {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    }

    #media-display img, #media-display video {
      max-width: 100vw; max-height: 100vh; width: 100%; height: 100%; object-fit: contain;
    }

    .controls-container {
      position: absolute; bottom: 20px; right: 20px;
      display: flex; flex-direction: row; gap: 10px; z-index: 999;
      opacity: 0.5; transition: opacity 0.3s ease;
    }
    .controls-container:hover { opacity: 1; }

    .btn-action {
      background: rgba(0, 0, 0, 0.8); color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.5); padding: 10px 16px;
      cursor: pointer; border-radius: 8px; font-weight: bold; font-size: 0.9rem;
      backdrop-filter: blur(4px); transition: background 0.2s, transform 0.1s;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); min-width: 100px;
    }
    .btn-action:hover { background: #ffffff; color: #000000; border-color: #ffffff; transform: scale(1.05); }

    #sync-indicator {
      position: absolute; top: 15px; left: 15px;
      background: rgba(0, 0, 0, 0.7); color: #fff; padding: 8px 14px;
      border-radius: 20px; font-size: 0.8rem; display: flex; align-items: center; gap: 8px;
      z-index: 998; opacity: 0; transition: opacity 0.5s ease; pointer-events: none;
    }
    #sync-indicator.show { opacity: 1; }
    .dot { width: 8px; height: 8px; background: #00ff66; border-radius: 50%; box-shadow: 0 0 8px #00ff66; }

    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal.hidden { display: none !important; }
    
    .modal-content {
      background: #fff; padding: 24px; border-radius: 12px; width: 340px;
      display: flex; flex-direction: column; gap: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .modal-content h2 { font-size: 1.2rem; margin-bottom: 4px; color: #333; }
    .modal-content label { font-size: 0.85rem; font-weight: bold; color: #555; margin-bottom: -6px; }
    .modal-content input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; width: 100%; }
    .modal-content button {
      padding: 10px; background: #007bff; color: white; border: none; border-radius: 6px;
      font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 4px;
    }
    .modal-content button:hover { background: #0056b3; }
    .modal-content button.close-btn { background: #6c757d; }
    .modal-content button.close-btn:hover { background: #5a6268; }
    .modal-content button.logout-btn { background: #dc3545; }
    .modal-content button.logout-btn:hover { background: #bd2130; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="slider-container" class="fullscreen">
    <div id="sync-indicator">
      <span class="dot"></span> Memeriksa perubahan Drive...
    </div>

    <div id="media-display">
      <h3 style="color: white; font-weight: normal;">Memuat media...</h3>
    </div>

    <div class="controls-container">
      <button id="btn-fullscreen" class="btn-action" onclick="toggleFullscreen()">
        <span>⛶</span> Fullscreen
      </button>
      <button id="btn-admin" class="btn-action" onclick="openAdminModal()">
        <span>⚙️</span> Admin
      </button>
    </div>
  </div>

  <div id="admin-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Panel Admin</h2>
      
      <div id="login-form" style="display: flex; flex-direction: column; gap: 10px;">
        <input type="password" id="admin-pass" placeholder="Password Admin">
        <button onclick="loginAdmin()">Login</button>
      </div>

      <div id="admin-controls" class="hidden" style="display: flex; flex-direction: column; gap: 10px;">
        <label>Google Drive API Key:</label>
        <input type="text" id="drive-api-key" placeholder="API Key Default HTML">

        <label>Folder ID Google Drive:</label>
        <input type="text" id="drive-folder-id" placeholder="Folder ID Default HTML">
        
        <label>Interval Slide (Detik):</label>
        <input type="number" id="slide-interval" value="5" min="1">

        <label>Interval Auto Sync (Menit):</label>
        <input type="number" id="sync-interval" value="1" min="1">

        <label>Password Admin Baru:</label>
        <input type="password" id="new-admin-pass" placeholder="Kosongkan jika tak diubah">

        <button onclick="saveSettings()">Simpan & Sync</button>
        <button class="logout-btn" onclick="logoutAdmin()">Logout</button>
      </div>

      <button class="close-btn" onclick="closeAdminModal()">Tutup</button>
    </div>
  </div>

  <script>
    // ============================================================
    // KONFIGURASI DEFAULT UTAMA (HTML CODE)
    // ============================================================
    const DEFAULT_API_KEY = 'MASUKKAN_GOOGLE_DRIVE_API_KEY_ANDA_DI_SINI';
    const DEFAULT_FOLDER_ID = 'MASUKKAN_FOLDER_ID_GOOGLE_DRIVE_DI_SINI';
    const DEFAULT_PASSWORD = 'admin123';
    const DEFAULT_INTERVAL = 5; 
    const DEFAULT_SYNC_INTERVAL = 1; 

    // Mencegah bentrok data dengan aplikasi lain di domain/origin yang sama:
    // Kunci storage dibuat unik berdasarkan Folder ID default dari kode HTML
    const STORAGE_PREFIX = 'app_' + DEFAULT_FOLDER_ID.substring(0, 8) + '_';

    let mediaList = [];
    let currentIndex = 0;
    let slideTimer = null;
    let syncTimer = null;

    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'media-slider-v3';
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => self.clients.claim());
        self.addEventListener('fetch', e => {
          e.respondWith(caches.match(e.request).then(res => res || fetch(e.request)));
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(console.error);
    }

    // Hanya ambil dari Storage jika user PERNAH menyimpan perubahan input
    function getApiKey() { 
      return localStorage.getItem(STORAGE_PREFIX + 'drive_api_key') || DEFAULT_API_KEY; 
    }
    
    function getFolderId() { 
      return localStorage.getItem(STORAGE_PREFIX + 'drive_folder_id') || DEFAULT_FOLDER_ID; 
    }
    
    function getAdminPassword() { 
      return localStorage.getItem(STORAGE_PREFIX + 'admin_password') || DEFAULT_PASSWORD; 
    }
    
    function getSlideInterval() { 
      return parseInt(localStorage.getItem(STORAGE_PREFIX + 'slide_interval')) || DEFAULT_INTERVAL; 
    }
    
    function getSyncInterval() { 
      return parseInt(localStorage.getItem(STORAGE_PREFIX + 'sync_interval')) || DEFAULT_SYNC_INTERVAL; 
    }

    window.onload = () => {
      // Isi form Admin dengan data aktif (Default HTML / Storage jika pernah diubah)
      document.getElementById('drive-api-key').value = getApiKey();
      document.getElementById('drive-folder-id').value = getFolderId();
      document.getElementById('slide-interval').value = getSlideInterval();
      document.getElementById('sync-interval').value = getSyncInterval();

      loadMedia();
      startSlider();
      startAutoSync();
    };

    function toggleFullscreen() {
      const elem = document.documentElement;
      if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
        else if (elem.mozRequestFullScreen) elem.mozRequestFullScreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
        else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
      }
    }

    async function fetchFromDrive(folderId, apiKey) {
      if (!folderId || !apiKey || folderId.includes('MASUKKAN_') || apiKey.includes('MASUKKAN_')) {
        return [];
      }

      const query = encodeURIComponent(`'${folderId.trim()}' in parents and trashed = false`);
      const url = `https://www.googleapis.com/drive/v3/files?q=${query}&fields=files(id,mimeType,name,modifiedTime)&key=${apiKey.trim()}`;

      try {
        const res = await fetch(url, { cache: "no-store" });
        const data = await res.json();

        if (data.error) {
          console.error("Drive API Error:", data.error.message);
          return [];
        }

        if (!data.files) return [];

        data.files.sort((a, b) => a.name.localeCompare(b.name));

        const timestamp = new Date().getTime();
        return data.files.map(file => ({
          id: file.id,
          modifiedTime: file.modifiedTime,
          url: `https://lh3.googleusercontent.com/d/${file.id}?t=${timestamp}`,
          type: file.mimeType.startsWith('video/') ? 'video' : 'image'
        }));
      } catch (err) {
        console.warn("Gagal terhubung ke Drive, menggunakan offline cache...", err);
        return [];
      }
    }

    async function loadMedia(silent = false) {
      const apiKey = getApiKey();
      const folderId = getFolderId();
      const indicator = document.getElementById('sync-indicator');

      if (silent && navigator.onLine) {
        indicator.classList.add('show');
      }

      if (navigator.onLine) {
        const driveMedia = await fetchFromDrive(folderId, apiKey);
        
        if (driveMedia.length > 0) {
          const currentHash = mediaList.map(m => m.id + '_' + (m.modifiedTime || '')).join(',');
          const newHash = driveMedia.map(m => m.id + '_' + (m.modifiedTime || '')).join(',');

          if (currentHash !== newHash) {
            mediaList = driveMedia;
            
            if ('caches' in window) {
              caches.delete('media-cache-v1');
              const cache = await caches.open('media-cache-v1');
              mediaList.forEach(m => cache.add(m.url).catch(() => {}));
            }
            
            localStorage.setItem(STORAGE_PREFIX + 'cached_media_list', JSON.stringify(mediaList));

            if (currentIndex >= mediaList.length) {
              currentIndex = 0;
            }
            showMedia(currentIndex);
          }
        } else if (mediaList.length === 0) {
          loadFromLocalCache();
        }
      } else {
        loadFromLocalCache();
      }

      setTimeout(() => {
        indicator.classList.remove('show');
      }, 2000);
    }

    function loadFromLocalCache() {
      const stored = localStorage.getItem(STORAGE_PREFIX + 'cached_media_list');
      if (stored) {
        mediaList = JSON.parse(stored);
      }
      showMedia(currentIndex);
    }

    function startAutoSync() {
      const intervalMs = getSyncInterval() * 60 * 1000;
      clearInterval(syncTimer);
      
      syncTimer = setInterval(() => {
        if (navigator.onLine) {
          loadMedia(true);
        }
      }, intervalMs);
    }

    function showMedia(index) {
      const display = document.getElementById('media-display');
      if (mediaList.length === 0) {
        display.innerHTML = '<h3 style="color:white; text-align:center; padding: 20px;">Belum ada konten.<br><small style="font-size:0.8rem; color:#aaa;">Buka menu Admin untuk mengatur API Key & Folder ID.</small></h3>';
        return;
      }

      if (index >= mediaList.length) {
        currentIndex = 0;
        index = 0;
      }

      const item = mediaList[index];
      if (item.type === 'video') {
        display.innerHTML = `<video src="${item.url}" autoplay muted loop style="max-width:100vw; max-height:100vh;"></video>`;
      } else {
        display.innerHTML = `<img src="${item.url}" style="max-width:100vw; max-height:100vh;">`;
      }
    }

    function startSlider() {
      const intervalMs = getSlideInterval() * 1000;
      clearInterval(slideTimer);
      slideTimer = setInterval(() => {
        if (mediaList.length > 0) {
          currentIndex = (currentIndex + 1) % mediaList.length;
          showMedia(currentIndex);
        }
      }, intervalMs);
    }

    function loginAdmin() {
      const passInput = document.getElementById('admin-pass').value;
      if (passInput === getAdminPassword()) {
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('admin-controls').classList.remove('hidden');
      } else {
        alert('Password Admin Salah!');
      }
    }

    function saveSettings() {
      const apiKeyInput = document.getElementById('drive-api-key').value.trim();
      const folderIdInput = document.getElementById('drive-folder-id').value.trim();
      const intervalInput = document.getElementById('slide-interval').value;
      const syncIntervalInput = document.getElementById('sync-interval').value;
      const newPassInput = document.getElementById('new-admin-pass').value.trim();

      // SIMPAN ATAU HAPUS: Jika input diisi dan beda dengan default HTML, simpan ke storage.
      // Jika dikosongkan/sama dengan default HTML, hapus dari storage.
      if (apiKeyInput && apiKeyInput !== DEFAULT_API_KEY) {
        localStorage.setItem(STORAGE_PREFIX + 'drive_api_key', apiKeyInput);
      } else {
        localStorage.removeItem(STORAGE_PREFIX + 'drive_api_key');
        document.getElementById('drive-api-key').value = DEFAULT_API_KEY;
      }

      if (folderIdInput && folderIdInput !== DEFAULT_FOLDER_ID) {
        localStorage.setItem(STORAGE_PREFIX + 'drive_folder_id', folderIdInput);
      } else {
        localStorage.removeItem(STORAGE_PREFIX + 'drive_folder_id');
        document.getElementById('drive-folder-id').value = DEFAULT_FOLDER_ID;
      }

      if (intervalInput) {
        localStorage.setItem(STORAGE_PREFIX + 'slide_interval', intervalInput);
      }

      if (syncIntervalInput) {
        localStorage.setItem(STORAGE_PREFIX + 'sync_interval', syncIntervalInput);
      }

      if (newPassInput) {
        localStorage.setItem(STORAGE_PREFIX + 'admin_password', newPassInput);
        alert('Pengaturan dan Password Admin baru disimpan!');
      } else {
        alert('Pengaturan disimpan!');
      }

      mediaList = []; 
      loadMedia();
      startSlider();
      startAutoSync();
      closeAdminModal();
    }

    function openAdminModal() { 
      document.getElementById('admin-modal').classList.remove('hidden'); 
    }

    // PERBAIKAN: Selalu reset form login dan bersihkan input password saat modal ditutup
    function closeAdminModal() { 
      document.getElementById('admin-modal').classList.add('hidden'); 
      document.getElementById('login-form').classList.remove('hidden');
      document.getElementById('admin-controls').classList.add('hidden');
      document.getElementById('admin-pass').value = '';
      document.getElementById('new-admin-pass').value = '';
    }

    function logoutAdmin() {
      closeAdminModal();
    }
  </script>
</body>
</html>
